name: Publish public place data

'on':
  push:
    branches: [main]
    paths:
      - public/jeju.json
      - public/national.json
      - .github/workflows/publish.yml
      - scripts/sync-data.mjs
      - test/**
  workflow_dispatch:

concurrency:
  group: public-data-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Set up current Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false

      - name: Test publisher and workflow contract
        run: node --test test/*.test.mjs

      - name: Build metadata from committed GAS snapshots
        run: node scripts/sync-data.mjs --prepare

      - name: Validate the complete artifact
        run: node scripts/sync-data.mjs --validate

      - name: Upload only validated public assets
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public/
          include-hidden-files: true
          retention-days: 1

      - name: Deploy Pages in this same workflow
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
